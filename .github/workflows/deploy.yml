name: Deploy ONCurve to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      host_key_verified:
        description: Confirm DreamHost independently verified the pinned ED25519 fingerprint
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: oncurve-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ryanmanning01/OnCurveWeb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Require independent host identity verification
        # The pinned fingerprint has been independently verified with DreamHost.
        # Push runs need no dispatch input; every run still checks the actual key.
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFIED: ${{ inputs.host_key_verified }}
        run: |
          set -euo pipefail
          if [[ "$VERIFIED" != "true" ]]; then
            echo "Verify the ED25519 fingerprint with DreamHost through a trusted channel before deployment."
            exit 1
          fi

      - name: Check out reviewed main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export and deployment configuration
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/privacy/index.html
          test -s out/clinical-sources/index.html
          node <<'NODE'
          const { config } = require('./.next/required-server-files.json');
          if (config.output !== 'export' || config.basePath !== '/oncurve' ||
              config.trailingSlash !== true || config.images.unoptimized !== true) {
            throw new Error('Unexpected static export configuration');
          }
          NODE
          if find out -type l -print -quit | grep -q .; then
            echo "Refusing to deploy an export containing symlinks."
            exit 1
          fi

      - name: Verify pinned host key and deploy only ONCurve
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          DREAMHOST_REMOTE_PATH: ${{ secrets.DREAMHOST_REMOTE_PATH }}
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DREAMHOST_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "Invalid SSH hostname."; exit 1; }
          [[ "$DREAMHOST_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]] || { echo "Invalid SSH username."; exit 1; }
          remote_path="${DREAMHOST_REMOTE_PATH%/}"
          [[ "$remote_path" == '/home/rmanning/flowuxdesign.com/oncurve' ]] || { echo "Remote path must be the approved ONCurve directory."; exit 1; }
          test -n "$DREAMHOST_SSH_KEY"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT

          # Scanning supplies a candidate key, never a trust decision.
          expected='SHA256:h/r7JweQfFjnEVvdRTrV39DwAaBfxwX6/g3pJfyF+k8'
          ssh-keyscan -T 10 -t ed25519 "$DREAMHOST_HOST" > "$ssh_dir/candidates" 2>/dev/null
          count=0
          while read -r scanned_host key_type key_data extra; do
            [[ -z "$scanned_host" || "$scanned_host" == \#* ]] && continue
            [[ "$key_type" == 'ssh-ed25519' && -z "${extra:-}" ]] || exit 1
            printf '%s %s\n' "$key_type" "$key_data" > "$ssh_dir/candidate.pub"
            fingerprint="$(ssh-keygen -lf "$ssh_dir/candidate.pub" -E sha256 | awk '{print $2}')"
            [[ "$fingerprint" == "$expected" ]] || { echo "SSH host fingerprint mismatch. Deployment stopped."; exit 1; }
            printf 'oncurve-dreamhost %s %s\n' "$key_type" "$key_data" >> "$ssh_dir/known_hosts"
            count=$((count + 1))
          done < "$ssh_dir/candidates"
          [[ "$count" -gt 0 ]] || { echo "No verified ED25519 host key found."; exit 1; }

          printf '%s\n' "$DREAMHOST_SSH_KEY" > "$ssh_dir/id"
          unset DREAMHOST_SSH_KEY
          ssh-keygen -y -P '' -f "$ssh_dir/id" > /dev/null
          # Fixed alias binds every SSH connection to the fingerprint checked above.
          cat > "$ssh_dir/config" <<EOF
          Host oncurve-dreamhost
            HostName $DREAMHOST_HOST
            User $DREAMHOST_USER
            Port 22
            IdentityFile $ssh_dir/id
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            StrictHostKeyChecking yes
            UserKnownHostsFile $ssh_dir/known_hosts
            GlobalKnownHostsFile /dev/null
            HostKeyAlias oncurve-dreamhost
            HostKeyAlgorithms ssh-ed25519
            UpdateHostKeys no
            ConnectTimeout 15
          EOF

          # Validate the canonical target and reject existing symlinks before writing.
          ssh -F "$ssh_dir/config" oncurve-dreamhost bash -s -- "$remote_path" <<'REMOTE'
          set -euo pipefail
          target="$1"
          [[ "$target" == '/home/rmanning/flowuxdesign.com/oncurve' ]]
          parent="$(dirname "$target")"
          [[ "$(readlink -f "$parent")" == "$parent" ]]
          [[ ! -L "$target" ]]
          if [[ ! -e "$target" ]]; then mkdir -- "$target"; fi
          [[ -d "$target" && "$(readlink -f "$target")" == "$target" ]]
          if find "$target" -type l -print -quit | grep -q .; then
            echo "Remote ONCurve directory contains symlinks; review before deploying."
            exit 1
          fi
          REMOTE

          # Trailing slash uploads contents; intentionally no --delete or --keep-dirlinks.
          rsync -rtz --safe-links --delay-updates \
            -e "ssh -F $ssh_dir/config" \
            -- out/ "oncurve-dreamhost:$remote_path/"
